<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Voice Agent</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="overlay">
      <div id="overlay-content">
        <p id="overlay-text">Click to start</p>
      </div>
    </div>

    <!-- Chat (Milestone 2) -->
    <div id="chat">
      <div id="messages"></div>
      <form id="chat-form" autocomplete="off">
        <input
          id="chat-input"
          type="text"
          maxlength="500"
          placeholder="Say something..."
          disabled
        />
        <button id="chat-send" type="submit" disabled>Send</button>
      </form>
    </div>

    <script type="module" src="main.js"></script>
    <script type="module" src="chat.js"></script>
  </body>
</html>
